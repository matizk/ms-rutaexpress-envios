# Aplicar sobre compose.kafka.yml en la segunda EC2, dedicada a Kafka.
services:
  kafka-1:
    environment:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PRIVATE://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PRIVATE://${KAFKA_PRIVATE_IP:?Configurar la IP privada de EC2 Kafka}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PRIVATE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    ports: ["${KAFKA_PRIVATE_IP:?Configurar la IP privada de EC2 Kafka}:9092:9092"]

  kafka-2:
    environment:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PRIVATE://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PRIVATE://${KAFKA_PRIVATE_IP:?Configurar la IP privada de EC2 Kafka}:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PRIVATE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    ports: ["${KAFKA_PRIVATE_IP:?Configurar la IP privada de EC2 Kafka}:9093:9093"]
