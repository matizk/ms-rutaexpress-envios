spring.application.name=ms-rutaexpress-shipments
app.security.azure.enabled=${AZURE_ENABLED:false}
app.security.azure.tenant-id=${AZURE_TENANT_ID:}
app.security.azure.audience=${AZURE_API_CLIENT_ID:}
app.security.azure.client-id=${AZURE_SPA_CLIENT_ID:}
app.security.azure.scope=${AZURE_OPERATOR_SCOPE:operator.access}
app.security.azure.jwk-set-uri=${AZURE_JWK_SET_URI:}
server.port=${SERVER_PORT:5000}

# Punto de verificación seguro para Docker, AWS y monitoreo básico.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
info.app.name=ms-rutaexpress-shipments
info.app.description=Microservicio de envios de RutaExpress

# URL interna configurable para Docker y despliegue en AWS.
catalog.base-url=${CATALOGO_URL:http://localhost:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/shipments_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rutaexpress}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

# EV2 is opt-in so the previous deployment remains usable while RabbitMQ is configured.
app.messaging.enabled=${MESSAGING_ENABLED:false}
app.messaging.events-exchange=rutaexpress.events
app.messaging.commands-exchange=rutaexpress.commands
app.messaging.ticket-routing-key=ticket.generate
app.messaging.publish-delay-ms=2000
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=3s
management.health.rabbit.enabled=${MESSAGING_ENABLED:false}
