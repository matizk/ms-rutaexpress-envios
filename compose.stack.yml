services:
  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: rutaexpress
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rutaexpress -d catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  shipments-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shipments_db
      POSTGRES_USER: rutaexpress
      POSTGRES_PASSWORD: ${SHIPMENTS_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - shipments-db-data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rutaexpress -d shipments_db"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  catalog:
    build:
      context: ../ms-rutaexpress-catalogo
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/catalog_db
      SPRING_DATASOURCE_USERNAME: rutaexpress
      SPRING_DATASOURCE_PASSWORD: ${CATALOG_DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      CORS_ALLOWED_ORIGIN: ${FRONTEND_PUBLIC_URL:-http://localhost:4200}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      catalog-db:
        condition: service_healthy

  shipments:
    build:
      context: .
    environment:
      SERVER_PORT: 5000
      SPRING_DATASOURCE_URL: jdbc:postgresql://shipments-db:5432/shipments_db
      SPRING_DATASOURCE_USERNAME: rutaexpress
      SPRING_DATASOURCE_PASSWORD: ${SHIPMENTS_DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      CATALOGO_URL: http://catalog:8081
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      shipments-db:
        condition: service_healthy
      catalog:
        condition: service_healthy

  report:
    build:
      context: ../ms-rutaexpress-reportes
    environment:
      SERVER_PORT: 8082
      SHIPMENTS_URL: http://shipments:5000
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      shipments:
        condition: service_healthy

  bff:
    build:
      context: ../ms-rutaexpress-intermediario
    environment:
      SERVER_PORT: 8080
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      CATALOGO_URL: http://catalog:8081
      SHIPMENTS_URL: http://shipments:5000
      REPORT_URL: http://report:8082
      CORS_ALLOWED_ORIGIN: ${FRONTEND_PUBLIC_URL:-http://localhost:4200}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      catalog:
        condition: service_healthy
      shipments:
        condition: service_healthy
      report:
        condition: service_healthy

  frontend:
    build:
      context: ../interfaz-rutaexpress
    ports:
      - "4200:80"
    depends_on:
      bff:
        condition: service_healthy

volumes:
  catalog-db-data:
  shipments-db-data:
